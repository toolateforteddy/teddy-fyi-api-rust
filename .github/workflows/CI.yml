name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

# This workflow clones the repository, compiles it and runs tests. It needs nothing else:
# no comments to post, no commits to push, no packages to publish. Without this block the
# job gets GitHub's default token, which on this repo is far broader than that, and every
# third-party action in the steps below runs with it.
permissions:
  contents: read

jobs:
  test:
    name: Run Lints and Tests
    runs-on: ubuntu-latest

    # Service containers for integration tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        entrypoint: docker-entrypoint.sh
        command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off

      # Redis backs the SSE fan-out and the Gemini budget counters. Without it the
      # tests that need it skip silently (see `redis_or_skip`), so CI would report
      # green on a suite that never ran.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # Set up Rust toolchain for running tests
      - name: Set up Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Run Clippy
        run: cargo clippy -- -D warnings

      # The local-development build. `dev-auth` is off by default and therefore off in every
      # step above, so without this the configuration developers actually run — and the
      # `mock.` login bypass it compiles in — is never built or tested by CI, and rots.
      - name: Run Clippy (dev-auth)
        run: cargo clippy --features dev-auth -- -D warnings

      # Everything above and below runs with SQLX_OFFLINE=true, which checks the `query!`
      # macros against the committed `.sqlx/` descriptors instead of a database. That makes
      # CI fast and makes it possible to build without Postgres — and it means a `.sqlx`
      # entry that no longer matches the schema, or a query whose descriptor was never
      # regenerated, compiles green here and fails against real Postgres in production.
      # This step is the thing that stops that: it regenerates the descriptors against a
      # live database with the migrations applied and fails if they differ from what is
      # committed. It is the only step in this workflow that talks to Postgres with
      # SQLX_OFFLINE unset, which is the whole point.
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --locked --version ^0.8 --no-default-features --features rustls,postgres

      - name: Apply Migrations
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/test_db
        run: cargo sqlx migrate run

      - name: Check SQLx Offline Cache
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/test_db
        run: |
          if ! cargo sqlx prepare --check -- --tests; then
            echo "::error::The committed .sqlx offline cache does not match the queries in this branch. Run 'cargo sqlx prepare -- --tests' (or 'make prepare') against a database with all migrations applied, and commit the .sqlx changes."
            exit 1
          fi

      # Run Cargo tests (requires SQLx offline mode for query verification and a running Postgres instance)
      - name: Run Tests
        env:
          SQLX_OFFLINE: true
          DATABASE_URL: postgres://postgres:password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
        run: make test

      # Each feature configuration compiles tests the other does not: `make test` proves the
      # shipped binary rejects `mock.` tokens whatever COOKIE_DOMAIN is, and this proves the
      # bypass still works for developers who rely on it.
      - name: Run Tests (dev-auth)
        env:
          SQLX_OFFLINE: true
          DATABASE_URL: postgres://postgres:password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
        run: make test-dev-auth
