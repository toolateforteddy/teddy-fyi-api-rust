name: Code Janitor (Rust)

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    # Database service for running integration tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        entrypoint: docker-entrypoint.sh
        command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off

    env:
      SQLX_OFFLINE: "true"
      DATABASE_URL: postgres://postgres:password@localhost:5432/test_db

    steps:
      - name: Checkout Target Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Set up Rust toolchain for running tests
      - name: Set up Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Run Code Janitor
        uses: toolateforteddy/code-janitor@main
        with:
          provider: 'google'
          model: 'gemini-3.6-flash'
          lint_command: 'cargo clippy -- -D warnings'
          test_command: 'SQLX_OFFLINE=true DATABASE_URL=postgres://postgres:password@localhost:5432/test_db cargo test'
          max_line_diff: 80
          draft_pr: false
          assignees: 'toolateforteddy'
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
