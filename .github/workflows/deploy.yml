name: Build and Push to Google Container Registry

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    name: Build and Push Image
    runs-on: ubuntu-latest

    # Required permissions for Workload Identity Federation
    permissions:
      contents: 'read'
      id-token: 'write'

    # Database service for running integration tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        entrypoint: docker-entrypoint.sh
        command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off

      # Redis backs the SSE fan-out and the Gemini budget counters, and this job runs the
      # same `make test` as CI.yml -- so it needs the same services. Without Redis the
      # tests that check for it skip silently (see `redis_or_skip`), leaving this gate
      # weaker than the one the PR already passed, and the one test that connects
      # unconditionally fails the deploy outright.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # Set up Rust toolchain for running tests
      - name: Set up Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      # Run Cargo tests (requires SQLx offline mode for query verification)
      - name: Run Tests
        env:
          SQLX_OFFLINE: true
          DATABASE_URL: postgres://postgres:password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
        run: make test

      # Authenticate to Google Cloud.
      # You can authenticate using either Workload Identity Federation (Recommended)
      # or a Google Cloud Service Account Key. See the documentation in the pull request / readme.
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Set up Docker Buildx (required for caching)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Set up gcloud CLI & configure docker authentication
      - name: Configure Docker
        run: |
          gcloud auth configure-docker gcr.io --quiet

      # Build, tag, and push the container using the official docker/build-push-action.
      # This builds and pushes directly to GCR, bypassing the slow local docker load step,
      # and utilizes the gha cache backend.
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            gcr.io/melodic-sunbeam-164916/teddy-fyi-api-rust:latest
            gcr.io/melodic-sunbeam-164916/teddy-fyi-api-rust:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: prod
          location: us-central1-a
          project_id: melodic-sunbeam-164916

      # The manifests name `:IMAGE_TAG_PLACEHOLDER` rather than a tag that moves, so the
      # revision being deployed is written into them here, in the workspace, before anything
      # is applied. See `k8s/api-rust.yaml` for the argument; the short version is that
      # `:latest` gave up rollback and provenance, and would let a fork's merge to `main`
      # replace the running binary with no deploy of ours.
      #
      # The check afterwards is the part that matters: a manifest that reaches the cluster
      # with the placeholder still in it fails to pull, and it should fail here instead —
      # loudly, before `apply`, with the file named.
      #
      # Both the substitution and the check are restricted to `image:` lines, because the
      # manifests also *mention* the placeholder in the comments that explain it, and
      # rewriting an explanation to contain a commit SHA makes the rendered file nonsense.
      - name: Pin manifests to this revision
        run: |
          sed -i "/^[[:space:]]*image:/s|IMAGE_TAG_PLACEHOLDER|${{ github.sha }}|g" k8s/*.yaml
          if grep -rnE '^[[:space:]]*image:.*IMAGE_TAG_PLACEHOLDER' k8s/; then
            echo "::error::an image: line still carries IMAGE_TAG_PLACEHOLDER after substitution"
            exit 1
          fi
          grep -rnE '^[[:space:]]*image:' k8s/

      # The manifests live in this repo (k8s/), so a change to the Deployment ships in the
      # same commit as the code that needs it — a new env var and the `env::var` that reads
      # it can no longer reach prod on different days.
      #
      # This is now the whole deploy. It used to be `apply` followed by an unconditional
      # `rollout restart`, because `apply` reconciles spec changes but will not re-pull a tag
      # that has moved underneath it. With the image pinned to the SHA, the spec change *is*
      # the new image, so `apply` starts the rollout by itself and a restart would only add a
      # second, redundant one.
      #
      # What that drops, deliberately: a deploy no longer restarts the pods when nothing in
      # the spec changed. Re-running this workflow on an unchanged commit is now a no-op
      # rather than a rolling restart — which is right — but it also means a secret rotated
      # in Secret Manager is not picked up by pushing an empty commit. Run
      # `kubectl rollout restart deployment/api-rust-dep` for that, deliberately.
      - name: Apply Kubernetes Manifests
        run: kubectl apply -f k8s/

      - name: Wait for the rollout
        run: |
          # Without this the job is green the moment the change is *accepted*, so a
          # crashlooping image reports a successful deploy. `rollout status` blocks
          # until the new ReplicaSet is actually available and exits non-zero if it
          # never gets there.
          kubectl rollout status deployment/api-rust-dep --timeout=5m
