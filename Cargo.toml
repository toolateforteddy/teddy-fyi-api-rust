[package]
name = "teddy-fyi-api-rust"
version = "0.1.0"
edition = "2021"

[features]
default = []
# Compiles in the `mock.` login bypass in `src/auth/dev_bypass.rs`, which mints a session
# for whatever `user_id` the request body names without validating anything. It exists so a
# laptop with no Google credentials can sign in. It is deliberately NOT a default feature:
# `cargo build --release` (what the Dockerfile runs) leaves the accepting branch out of the
# binary entirely, so no environment variable or request can re-enable it in production.
# `make dev` / `scripts/dev.sh` turn it on for local work.
dev-auth = []

[dependencies]
# axum is our web framework, tokio is our async runtime
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
google-oauth = "1"
sqlx = { version = "0.8", features = [ "postgres", "macros", "chrono", "runtime-tokio-native-tls", "uuid" ] }
uuid = { version = "1.8", features = ["v4", "v5", "serde"] }
serde = "1.0.228"
serde_json = "1.0.150"
chrono = { version = "0.4.45", features = ["serde"] }
argon2 = "0.5.3"
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["rust_crypto", "use_pem"] }
rand = "0.10.1"
reqwest = { version = "0.12", features = ["json"] }
schemars = "0.8"
tower = { version = "0.5", features = ["limit", "load-shed", "util"] }
tower-http = { version = "0.6.10", features = ["catch-panic", "cors", "limit", "request-id", "timeout", "trace", "util"] }
redis = { version = "0.27", features = ["tokio-comp"] }
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
sha2 = "0.11.0"
# Per-IP rate limiting for the unauthenticated /auth/* routes. Pinned to 0.5.x because that
# is the last line built against axum 0.7 — 0.6+ target axum 0.8 and their layer will not
# compose with this router. `tracing` makes it log the throttled key, which is the only way
# an incident tells "one abusive address" from "everyone".
tower_governor = { version = "0.5.0", features = ["tracing"] }
# Only for the middleware marker types in tower_governor's public signatures; the version is
# the one tower_governor itself depends on.
governor = "0.8"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }


