apiVersion: v1
kind: Service
metadata:
  name: api-rust-svc
  annotations:
    cloud.google.com/backend-config: '{"default": "api-rust-be-config"}'
spec:
  selector:
    app: api-rust
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
  type: NodePort
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-rust-ksa
  annotations:
    iam.gke.io/gcp-service-account: api-rust-gsa@melodic-sunbeam-164916.iam.gserviceaccount.com
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: api-rust-gcp-secrets
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/melodic-sunbeam-164916/secrets/api-rust-client-id/versions/latest"
        path: "api-rust-client-id"
      - resourceName: "projects/melodic-sunbeam-164916/secrets/api-rust-db-url/versions/latest"
        path: "api-rust-db-url"
      - resourceName: "projects/melodic-sunbeam-164916/secrets/jwt_secret/versions/latest"
        path: "jwt_secret"
      - resourceName: "projects/melodic-sunbeam-164916/secrets/gemini_api_key_free/versions/latest"
        path: "gemini_api_key_free"
      - resourceName: "projects/melodic-sunbeam-164916/secrets/api-rust-grocery-web-client-id/versions/latest"
        path: "api-rust-grocery-web-client-id"
      - resourceName: "projects/melodic-sunbeam-164916/secrets/scribbleroute-api-client-id/versions/latest"
        path: "scribbleroute-api-client-id"
      - resourceName: "projects/melodic-sunbeam-164916/secrets/api-rust-ios-client-ids/versions/latest"
        path: "api-rust-ios-client-ids"
      - resourceName: "projects/melodic-sunbeam-164916/secrets/scribbleroute-keepcloud-client-id/versions/latest"
        path: "scribbleroute-keepcloud-client-id"
  secretObjects:
    - secretName: api-rust-secret-env
      type: Opaque
      data:
        - objectName: api-rust-client-id
          key: GOOGLE_CLIENT_ID
        - objectName: api-rust-db-url
          key: DATABASE_URL
        - objectName: jwt_secret
          key: JWT_SECRET
        - objectName: gemini_api_key_free
          key: GEMINI_API_KEY
        - objectName: api-rust-grocery-web-client-id
          key: GOOGLE_CLIENT_ID_GROCERY_WEB
        - objectName: scribbleroute-api-client-id
          key: SCRIBBLEROUTE_API_CLIENT_ID
        - objectName: api-rust-ios-client-ids
          key: GOOGLE_IOS_CLIENT_IDS
        - objectName: scribbleroute-keepcloud-client-id
          key: SCRIBBLEKEEP_CLOUD_CLIENT_ID
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-rust-dep
spec:
  replicas: 1
  # A pod is only counted available once it has been Ready this long. The readiness probe
  # says the socket answers; this says it kept answering, which is the difference between
  # a healthy replica and one that is about to crash-loop on a bad config.
  minReadySeconds: 10
  # Pinned rather than left to the percentage defaults. At one replica the defaults happen
  # to round to this same shape (25% of 1 rounds up for surge, down for unavailable), but
  # the rounding flips the moment replicas goes to 2 — 25% of 2 rounds *up* to one
  # unavailable, and the roll would start dropping serving capacity. Spell it out so the
  # guarantee survives a replica count change: bring the new pod up, wait for it, only
  # then take the old one down.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api-rust
  template:
    metadata:
      labels:
        app: api-rust
    spec:
      serviceAccountName: api-rust-ksa
      # The uid/gid here are the ones the Dockerfile creates and selects with
      # `USER 10001:10001`; they are stated again at this level so the guarantee lives in
      # the cluster rather than in the image. If the image ever loses its `USER` line, or
      # is replaced by one that has not got that user, `runAsNonRoot` fails the pod at
      # admission instead of quietly starting it as root. Changing either number without
      # changing the Dockerfile is a crash loop, not a hardening.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # The kubelet's default profile: everything glibc and tokio need, none of the
        # syscalls a container has no business making. `Unconfined` is what you get
        # without this line on a cluster whose default is not already RuntimeDefault.
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas across nodes, which during a rollout means the surge pod lands
      # somewhere other than the pod it is replacing. Without this both fit on one node,
      # and a deploy that is meant to be zero-downtime still has a single node as its
      # single point of failure — a drain or an auto-upgrade takes old and new together.
      #
      # DoNotSchedule, not ScheduleAnyway: a "preference" that silently gives up is the
      # same as not having the constraint on the days it matters. The cost is that a
      # rollout blocks until a second node has room, which the cluster autoscaler will
      # provide (the pool runs 1-3 nodes); today there is a second node with headroom, so
      # the surge pod schedules immediately and deploys stay fast.
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: api-rust
      containers:
      - name: api-rust
        # NOT a moving tag. `IMAGE_TAG_PLACEHOLDER` is substituted with the commit SHA by
        # `.github/workflows/deploy.yml` before it applies this directory, so the cluster
        # only ever runs an image some specific commit built.
        #
        # This used to say `:latest`, which cost three things. There was no rollback --
        # reverting meant rebuilding, because nothing in the cluster recorded which commit
        # was running -- and no provenance: `kubectl describe deploy` said `:latest` and
        # nothing more. The third is the split plan's §1.3 hazard, and it is the one that is
        # silent: once `scribbleroute/backend` is forked from this repo, its merges to `main`
        # push to the same `:latest`, and the next restart *anywhere* pulls the fork's binary
        # into `api-rust-dep`. A pinned SHA makes that impossible rather than unlikely.
        #
        # Applying this file by hand leaves the placeholder in place and the pod fails to
        # pull, loudly. That is deliberate: the alternative failure -- a hand-apply quietly
        # resolving a moving tag to whoever pushed last -- is the thing being removed.
        image: gcr.io/melodic-sunbeam-164916/teddy-fyi-api-rust:IMAGE_TAG_PLACEHOLDER
        env:
        - name: PORT
          value: "8080"
        - name: REDIS_URL
          value: "redis://cache-svc:6379"
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: api-rust-secret-env
              key: GOOGLE_CLIENT_ID
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: api-rust-secret-env
              key: DATABASE_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: api-rust-secret-env
              key: JWT_SECRET
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-rust-secret-env
              key: GEMINI_API_KEY
        - name: GOOGLE_CLIENT_ID_GROCERY_WEB
          valueFrom:
            secretKeyRef:
              name: api-rust-secret-env
              key: GOOGLE_CLIENT_ID_GROCERY_WEB
        - name: SCRIBBLEROUTE_API_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: api-rust-secret-env
              key: SCRIBBLEROUTE_API_CLIENT_ID
        - name: GOOGLE_IOS_CLIENT_IDS
          valueFrom:
            secretKeyRef:
              name: api-rust-secret-env
              key: GOOGLE_IOS_CLIENT_IDS
        # ScribbleKeep Cloud's Android client ID. Classified as a ScribbleRoute audience by
        # name in src/auth/client_ids.rs, so it needs no entry in SCRIBBLEROUTE_CLIENT_IDS
        # and no code change to be accepted -- but it does need to be here, or the Cloud
        # app's sign-in fails the audience check with a 401.
        - name: SCRIBBLEKEEP_CLOUD_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: api-rust-secret-env
              key: SCRIBBLEKEEP_CLOUD_CLIENT_ID
        ports:
        - name: http
          containerPort: 8080
        # The Prometheus exporter's own listener (METRICS_PORT, default 9090). Named so
        # k8s/monitoring.yaml can select it by name. Declared here only so the scrape
        # target resolves -- `api-rust-svc` deliberately does not expose it, so it stays
        # unreachable from the ingress. See k8s/monitoring.yaml.
        - name: metrics
          containerPort: 9090
        volumeMounts:
        - mountPath: "/var/secrets"
          name: gcp-secrets
          readOnly: true
        imagePullPolicy: Always
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        # Readiness asks the question readiness is for: can *this replica* serve right
        # now. `/healthz/ready` checks Redis (with a held connection and a short cached
        # verdict, so the cost does not scale with probe rate) and the passively-inferred
        # Postgres state, and answers 503 when either is out. See
        # `src/observability/health.rs`, 355 lines of which were dead in production for as
        # long as this probe pointed at `/healthcheck` — a route whose handler is the
        # string "OK".
        #
        # `failureThreshold` is spelled out rather than left to its default of 3 because
        # the number is load-bearing here: with `replicas: 1`, an unready pod is an outage
        # at the edge, so three consecutive failures ten seconds apart is the margin that
        # keeps a momentary Redis blip from pulling the only replica out of rotation. A
        # dependency that is genuinely down for half a minute *should* take it out — at
        # that point almost every endpoint is failing anyway, and an honest 503 beats a
        # pod that claims to be serving.
        readinessProbe:
          httpGet:
            path: /healthz/ready
            port: 8080
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        # Liveness stays a static string, and that is deliberate rather than lazy:
        # liveness failure means "kill this pod", so a probe that consulted a *shared*
        # dependency would let one Redis outage restart every replica at once, turning a
        # recoverable blip into a full outage. `/healthz/live` answers OK if the process
        # is up and the runtime is still scheduling, which is the only question whose
        # honest answer is "restart me".
        livenessProbe:
          httpGet:
            path: /healthz/live
            port: 8080
          initialDelaySeconds: 15
          timeoutSeconds: 5
          periodSeconds: 15
          failureThreshold: 3
        # Keep serving for a few seconds after Kubernetes decides to remove this pod.
        #
        # api-rust-svc is a NodePort behind the GKE ingress, so the load balancer targets
        # nodes and it is kube-proxy that picks the pod. Endpoint removal and the iptables
        # rewrite that follows it are asynchronous with the SIGTERM, so without this pause
        # requests keep arriving for a moment at a process that has already begun to shut
        # down — which the caller sees as a 502 in the middle of an otherwise clean deploy.
        #
        # preStop runs *before* SIGTERM, so this delays the signal rather than racing the
        # graceful shutdown in main.rs; the 30s termination grace period still bounds the
        # whole thing. Long-lived /api/sync/stream connections are cut regardless — clients
        # reconnect and reconcile on their next POST /api/sync.
        lifecycle:
          preStop:
            exec:
              command: ["sleep", "10"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          # The service is a single static binary that talks to Postgres, Redis and Google
          # over the network and writes nothing to disk — no temp files, no cache, no
          # crate in the dependency tree that reaches for `env::temp_dir()`. The only
          # mount it has is the secrets CSI volume, which is `readOnly: true` in its own
          # right. So there is nothing for a writable root filesystem to be for, and
          # anything that did start writing to it would be a bug worth failing loudly.
          # If a future feature genuinely needs scratch space, add an `emptyDir` at the
          # path it needs rather than turning this off.
          readOnlyRootFilesystem: true
      volumes:
      - name: gcp-secrets
        csi:
          driver: secrets-store-gke.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "api-rust-gcp-secrets"
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: api-rust-be-config
spec:
  timeoutSec: 60
  healthCheck:
    checkIntervalSec: 30
    timeoutSec: 25
    type: HTTP
    # `/healthz/live`, not `/healthz/ready`, and the difference is not an oversight.
    #
    # This is the *Google load balancer's* check, and it is a far coarser instrument than
    # the kubelet's: a 30-second interval with a 25-second timeout, and GKE is slow to
    # return a backend it has marked unhealthy. Pointing it at a dependency check would
    # let a few seconds of Redis trouble remove the backend from the load balancer for
    # minutes after Redis came back.
    #
    # It loses nothing, because readiness still governs rotation transitively:
    # `api-rust-svc` is a NodePort, so kube-proxy only forwards to *ready* pods. When the
    # readiness probe above takes the pod out, there is nothing behind the node port for
    # this check to reach and it fails on its own — just without a second, slower timer
    # racing the first one to decide the same thing.
    requestPath: /healthz/live
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: api-rust-cert
spec:
  domains:
    - api-rust.teddy.fyi
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: api-scribbleroute-cert
spec:
  domains:
    - api.scribbleroute.com
