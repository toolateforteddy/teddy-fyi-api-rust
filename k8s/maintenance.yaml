# The maintenance responder for api.scribbleroute.com.
#
# Phase 4 of context/2026-09-05_scribbleroute_backend_split.md freezes ScribbleRoute writes
# while the data tier is copied and re-keyed. During that freeze `api-rust-dep` is either
# scaled to zero or pointed at a database it must not serve from, and something still has to
# answer on the hostname -- because "nothing answers" and "planned maintenance" look identical
# from a tablet, and the tablets belong to people who are not the person doing the migration.
#
# This is that something: nginx, one replica, no dependencies, answering 503 with a body that
# says why. Deliberately a separate Deployment rather than a flag on the API, because the whole
# point is to keep answering during the minutes when the API cannot run at all.
#
# THIS IS NOT WIRED UP BY DEFAULT. Applying this file starts the responder; it takes no traffic
# until `site-ingress` in the teddyfyi repo points api.scribbleroute.com at
# `scribbleroute-maintenance-svc`. See context/2026-09-05_planned_maintenance.md for the order
# to do that in, and for the status document on scribbleroute.com that has to be flipped with it.
#
# Names are qualified (`scribbleroute-maintenance-*`) rather than bare. The split note's §"two
# ways a naive fork takes down production" is about exactly this: everything in api-rust.yaml is
# unqualified, so when scribbleroute/backend forks it and applies into the same cluster the two
# repos overwrite each other. This file is ScribbleRoute's from birth and is named that way, so
# it moves to the fork without a rename.
apiVersion: v1
kind: ConfigMap
metadata:
  name: scribbleroute-maintenance-nginx
data:
  nginx.conf: |
    worker_processes 1;
    # Not /var/run/nginx.pid, which is the compiled-in default: the container runs with a
    # read-only root filesystem, so the one file nginx insists on writing has to live on a
    # mount that is not the image. /tmp is an emptyDir; see the Deployment below.
    pid /tmp/nginx.pid;
    events { worker_connections 1024; }

    http {
      access_log /dev/stdout;
      error_log /dev/stderr;

      # Every path nginx writes to, named here rather than inherited from the build.
      #
      # The master creates all five of these at startup whether or not anything uses them,
      # and this server uses none of them -- it proxies nothing and spools no request
      # bodies. Their compiled-in defaults differ per build (/var/cache/nginx/* in the
      # official image, /var/lib/nginx/* in Debian's), so pinning them under /tmp means the
      # one writable mount this pod has is the one nginx actually wants, on any nginx.
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path       /tmp/proxy_temp;
      fastcgi_temp_path     /tmp/fastcgi_temp;
      uwsgi_temp_path       /tmp/uwsgi_temp;
      scgi_temp_path        /tmp/scgi_temp;

      server {
        listen 8080 default_server;

        # The health check must NOT be 503, and this is the whole reason the location exists.
        #
        # The GKE ingress will only send traffic to a backend its health check calls healthy.
        # A server that answers 503 to everything -- including the probe -- is marked unhealthy,
        # the load balancer stops routing to it, and clients get Google's own 502 error page
        # instead of the body below. That turns a deliberate, explained outage back into the
        # unexplained one this file exists to prevent. The BackendConfig points its
        # requestPath here.
        location = /healthz {
          access_log off;
          return 200 'ok';
          add_header Content-Type text/plain always;
        }

        # A browser will not show the 503 body to the page that asked for it unless the
        # preflight succeeds first, so preflights are answered normally. scribbleroute.com/link
        # is the caller that matters: without this it reports a CORS failure, which is the least
        # useful thing it could tell a parent during a planned window.
        location / {
          if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Client-UUID" always;
            add_header Access-Control-Max-Age 600 always;
            return 204;
          }
          return 503;
        }

        # `always`, on every header: nginx drops add_header from an error response without it,
        # and every response this server gives is an error response.
        error_page 503 = @maintenance;
        location @maintenance {
          default_type application/json;
          # Retry-After is the one header here with a behavioural effect. The Android client
          # parses it (core/data-cloud RetryAfter) and holds the scope off for that long, so a
          # fleet of tablets backs off on the server's schedule rather than each on its own.
          # Half an hour, clamped client-side to ten minutes, which is the intended outcome:
          # long enough to stop the hammering, short enough that nothing is stranded if the
          # window ends early.
          add_header Retry-After 1800 always;
          add_header Cache-Control "no-store" always;
          add_header Access-Control-Allow-Origin "*" always;
          return 503 '{"state":"maintenance","error":"planned_maintenance","message":"ScribbleRoute cloud sync is paused for planned maintenance. Work on the tablet is unaffected and will sync when this is over.","statusUrl":"https://scribbleroute.com/status","statusDocumentUrl":"https://scribbleroute.com/status.json"}';
        }
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: scribbleroute-maintenance-svc
  annotations:
    cloud.google.com/backend-config: '{"default": "scribbleroute-maintenance-be-config"}'
spec:
  selector:
    app: scribbleroute-maintenance
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
  # NodePort, matching api-rust-svc: it is what the GKE ingress can target.
  type: NodePort
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: scribbleroute-maintenance-be-config
spec:
  timeoutSec: 30
  healthCheck:
    checkIntervalSec: 15
    timeoutSec: 5
    type: HTTP
    requestPath: /healthz
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scribbleroute-maintenance-dep
spec:
  # Two, not one. This is the thing that has to answer while everything else is deliberately
  # broken, so it should not be one pod away from the outage having no voice; and at this size
  # a second nginx costs nothing worth counting.
  replicas: 2
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: scribbleroute-maintenance
  template:
    metadata:
      labels:
        app: scribbleroute-maintenance
      annotations:
        # Rolls the pods when the response body or headers change. nginx reads its config once
        # at start; without this a `kubectl apply` that edits the ConfigMap changes nothing that
        # is actually serving, which is a bad surprise to have mid-window.
        checksum/config: "nonroot-readonly-rootfs-pid-in-tmp"
    spec:
      # What `k8s/api-rust.yaml`, `cache.yaml` and `user-reaper.yaml` all say, arriving here
      # late: this file was written after the pod-hardening pass and inherited none of it.
      #
      # 101 is the `nginx` user the upstream alpine image creates, so the cache and pid files
      # this pod writes are owned by the account the image expects. Nothing resolves the
      # *name* -- there is no `user` directive in the config above, and a non-root master
      # could not honour one anyway -- so the number is all that matters, and an image
      # rebuild that renumbered its user would not break this.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        # ScheduleAnyway, unlike api-rust-dep's DoNotSchedule. There the cost of waiting for a
        # second node is a slower deploy; here it would be the maintenance page failing to come
        # up during the one window it is needed. Spread if you can, serve regardless.
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: scribbleroute-maintenance
      containers:
      - name: nginx
        image: nginx:1.29-alpine
        # Straight to nginx, skipping the image's `/docker-entrypoint.sh`.
        #
        # That script runs everything in `/docker-entrypoint.d/`, and the first of them
        # (`10-listen-on-ipv6-on-ipv4.sh`) does a `sed -i` on `/etc/nginx/conf.d/default.conf`
        # -- a file this pod never loads, since the config above has no `include` for that
        # directory. Under a read-only root filesystem that write fails, the entrypoint runs
        # with `set -e`, and the container dies before nginx starts. The other two scripts
        # (envsubst templating, worker autotuning) need environment variables and templates
        # that are not here.
        #
        # So there is nothing in the entrypoint this pod wants, and one thing in it that
        # would stop the pod from ever answering during the window it exists for.
        command: ["nginx", "-g", "daemon off;"]
        ports:
        - containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          # Everything nginx writes now lives under /tmp: the pid file and the five temp
          # directories, both pinned there by the config above. It serves no files from
          # disk either -- every response is a literal in the config -- so nothing outside
          # that one mount has any business being writable.
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        # One `emptyDir`, thrown away with the pod, holding the pid file and the five empty
        # temp directories the config names above. A `medium: Memory` emptyDir would count
        # against the 64Mi limit, which is not worth spending on an empty directory.
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 3
      volumes:
      - name: config
        configMap:
          name: scribbleroute-maintenance-nginx
      - name: tmp
        emptyDir: {}
