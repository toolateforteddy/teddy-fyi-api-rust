# Deletes accounts that have gone 12 months without a sync, per the retention commitment
# published at https://scribbleroute.com/privacy.
#
# Runs DAILY, not monthly: the policy promises removal within 30 days of an account passing
# the 12-month mark, so a monthly schedule would have zero slack for a single failed run.
# The cutoff is absolute, so the sweep is idempotent — a missed day is picked up the next.
#
# Reuses the api-rust image with a subcommand, and the same KSA and secret mount as
# api-rust-dep. It needs only DATABASE_URL and the in-cluster Redis; no auth or AI secrets.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: api-rust-user-reaper
spec:
  schedule: "20 9 * * *"
  concurrencyPolicy: Forbid
  # If the controller is down at the scheduled minute, still run when it comes back.
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      # A sweep that has not finished in an hour is wedged, not slow.
      activeDeadlineSeconds: 3600
      template:
        metadata:
          # Named in cache.yaml's NetworkPolicy: without a label the ingress rule
          # matches nothing and the sweep cannot reach cache-svc to announce deletions.
          labels:
            app: api-rust-user-reaper
        # This is the *pod* spec inside the CronJob's jobTemplate
        # (spec.jobTemplate.spec.template.spec), which is where a pod-level
        # securityContext has to go. Kubernetes silently ignores unknown fields at the
        # CronJob or Job level, so one nested a step too high would look applied and
        # enforce nothing.
        spec:
          restartPolicy: Never
          serviceAccountName: api-rust-ksa
          # Same image as api-rust-dep, so the same uid/gid the Dockerfile creates. Kept
          # in step with k8s/api-rust.yaml: one image, one answer.
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: user-reaper
            # Substituted with the commit SHA at deploy time; see the same field in
            # `api-rust.yaml` for why this is not a moving tag. It matters more here than
            # there: a CronJob re-pulls on every fire, so a `:latest` that a fork had
            # overwritten would put somebody else's binary in charge of *deleting accounts*
            # without any deploy of ours having happened.
            image: gcr.io/melodic-sunbeam-164916/teddy-fyi-api-rust:IMAGE_TAG_PLACEHOLDER
            command: ["./teddy-fyi-api-rust", "reap-stale-users"]
            env:
            # Reports what it WOULD delete and rolls the erase back. Set to "false" to arm;
            # any other value (or a typo) keeps it in dry-run.
            - name: REAP_DRY_RUN
              value: "true"
            - name: REAP_INACTIVE_MONTHS
              value: "12"
            - name: REDIS_URL
              value: "redis://cache-svc:6379"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-rust-secret-env
                  key: DATABASE_URL
            volumeMounts:
            # Mounting the CSI volume is what materializes api-rust-secret-env, so the job
            # does not depend on an api-rust-dep pod being up to resolve its secretKeyRef.
            - mountPath: "/var/secrets"
              name: gcp-secrets
              readOnly: true
            imagePullPolicy: Always
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              # The sweep reads Postgres and publishes to Redis; like the API it writes
              # nothing to disk, and its only mount is the read-only secrets volume.
              readOnlyRootFilesystem: true
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 256Mi
          volumes:
          - name: gcp-secrets
            csi:
              driver: secrets-store-gke.csi.k8s.io
              readOnly: true
              volumeAttributes:
                secretProviderClass: "api-rust-gcp-secrets"
